name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            arch: amd64
          - goarch: arm64
            arch: arm64
          - goarch: arm
            goarm: 7
            arch: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend assets
        run: |
          cd frontend
          npm install
          npm run build
        continue-on-error: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          go build -v -o x-ui-linux-${{ matrix.arch }} .

      - name: Package tar.gz
        run: |
          mkdir -p release/x-ui
          cp x-ui-linux-${{ matrix.arch }} release/x-ui/x-ui
          cp x-ui.sh release/x-ui/ || true
          tar -czf x-ui-linux-${{ matrix.arch }}.tar.gz -C release x-ui
          sha256sum x-ui-linux-${{ matrix.arch }}.tar.gz > x-ui-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.arch }}
          path: |
            x-ui-linux-${{ matrix.arch }}.tar.gz
            x-ui-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          prerelease: false